<h2 id="{{ include.id | escape }}" class="section-heading">
  <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24"><use href="#icon-{{ include.id | escape }}"></use></svg>
  {% if include.label_for %}
    <label for="{{ include.label_for | escape }}">{{ include.title | escape }}</label>
  {% else %}
    {{ include.title | escape }}
  {% endif %}
</h2>
