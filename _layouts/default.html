<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <!-- Keep the site fast: one static CSS file, no client-side JavaScript. -->
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
    <div class="site-shell">
        <aside class="site-sidebar" aria-label="Site navigation">
            <nav class="site-nav">
                <a class="{% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">HOME</a>
                <a class="{% if page.url == '/links.html' %}active{% endif %}" href="{{ '/links.html' | relative_url }}">links</a>
            </nav>
        </aside>

        <main class="container">
            {{ content }}
        </main>
    </div>
</body>
</html>
